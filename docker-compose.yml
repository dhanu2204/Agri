version: '3.8'
services:
  # 1. Setup the MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017" # Links port 27017 of your computer to the container
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db # Persists the database files on your computer

  # 2. Setup the Web Dashboard Service (Mongo Express)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081" # Links port 8081 of your computer to the dashboard container
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb # Name of the database service above
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongodb # Ensures database starts before the dashboard

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

# 3. Create a persistent storage volume

volumes:
  mongo-data:
    driver: local
